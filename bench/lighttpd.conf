# Local server for the benchmark suites on the TV (the TV's own /usr/sbin/lighttpd, run as root).
# Serving them from the TV takes the network out of the numbers; loopback only, nothing is exposed.
server.document-root = "/media/developer/bench"
server.bind = "127.0.0.1"
server.port = 8099
server.pid-file = "/tmp/bench-httpd.pid"
server.errorlog = "/tmp/bench-httpd.log"
index-file.names = ( "index.html" )
# pages/harness.html reports results as GET /beacon?... (a 404 is fine): the access log is the channel
# out of browsers we cannot instrument.
server.modules = ( "mod_accesslog" )
accesslog.filename = "/tmp/bench-access.log"
# Module scripts and wasm refuse to load with a wrong type.
mimetype.assign = (
  ".html" => "text/html", ".htm" => "text/html", ".js" => "text/javascript", ".mjs" => "text/javascript",
  ".css" => "text/css", ".json" => "application/json", ".wasm" => "application/wasm",
  ".svg" => "image/svg+xml", ".png" => "image/png", ".jpg" => "image/jpeg", ".gif" => "image/gif",
  ".webp" => "image/webp", ".woff" => "font/woff", ".woff2" => "font/woff2", ".ttf" => "font/ttf",
  ".txt" => "text/plain", ".map" => "application/json", ".wav" => "audio/wav", ".mp4" => "video/mp4",
  "" => "application/octet-stream"
)
