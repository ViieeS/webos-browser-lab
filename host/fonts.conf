<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The browser's own fontconfig setup (FONTCONFIG_FILE, set by the host). The TV's
     /etc/fonts has no generic aliases, so "serif" matched nothing, WebKit's last-resort font came
     out empty and the web process aborted (Speedometer, some sites). Names missing on the TV are
     skipped by fontconfig, so each list goes from best to safest. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <cachedir>/tmp/browser-cache/fontconfig</cachedir>
  <include ignore_missing="yes">/etc/fonts/conf.d/31-webos-aliases.conf</include>

  <alias binding="same"><family>serif</family>
    <prefer><family>Tinos</family><family>Droid Serif</family><family>Droid Sans Fallback</family></prefer></alias>
  <alias binding="same"><family>sans-serif</family>
    <prefer><family>Droid Sans</family><family>LG Smart UI</family><family>Droid Sans Fallback</family></prefer></alias>
  <alias binding="same"><family>monospace</family>
    <prefer><family>Droid Sans Mono</family><family>Droid Sans</family></prefer></alias>
  <alias binding="same"><family>system-ui</family>
    <prefer><family>LG Smart UI</family><family>Droid Sans</family></prefer></alias>
  <alias binding="same"><family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer></alias>

  <!-- Common web fonts to metric-compatible or look-alike faces the TV has. -->
  <alias binding="same"><family>Times New Roman</family><accept><family>Tinos</family></accept></alias>
  <alias binding="same"><family>Times</family><accept><family>Tinos</family></accept></alias>
  <alias binding="same"><family>Arial</family><accept><family>Droid Sans</family></accept></alias>
  <alias binding="same"><family>Helvetica</family><accept><family>Droid Sans</family></accept></alias>
  <alias binding="same"><family>Helvetica Neue</family><accept><family>Droid Sans</family></accept></alias>
  <alias binding="same"><family>Courier New</family><accept><family>Droid Sans Mono</family></accept></alias>
  <alias binding="same"><family>Courier</family><accept><family>Droid Sans Mono</family></accept></alias>

  <!-- Any family nothing above handles still ends on a real face, never on an empty match. -->
  <match target="pattern">
    <edit name="family" mode="append_last"><string>Droid Sans</string></edit>
    <edit name="family" mode="append_last"><string>Droid Sans Fallback</string></edit>
  </match>

  <!-- The TV's font dir also holds bitmap .bin files for broadcast captions; keep them out. -->
  <selectfont><rejectfont><glob>*.bin</glob></rejectfont></selectfont>
</fontconfig>
